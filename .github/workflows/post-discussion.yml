name: Post or update a hodge.computer discussion comment

on:
  workflow_dispatch:
    inputs:
      action:
        description: create (new top-level comment), reply (reply to a top-level comment), update (edit own comment), or read (print the comments named in target_id)
        required: true
        default: create
        type: choice
        options: [create, reply, update, read, relink]
      body_file:
        description: Path in this repository to the Markdown body
        required: true
        default: comment.md
      discussion_node_id:
        description: Discussion node ID (holdout = D_kwDOVLOOJc4AqE9G)
        required: true
        default: D_kwDOVLOOJc4AqE9G
      target_id:
        description: For reply, the top-level comment node ID; for update, the comment node ID to replace; for read, space-separated comment node IDs
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify the posting account
        env:
          GH_TOKEN: ${{ secrets.HODGE_DISCUSSION_TOKEN }}
        run: |
          gh api user --jq '.login' | sed 's/^/posting as /'
      - name: Post
        id: post
        env:
          GH_TOKEN: ${{ secrets.HODGE_DISCUSSION_TOKEN }}
          ACTION: ${{ inputs.action }}
          BODY_FILE: ${{ inputs.body_file }}
          DISCUSSION_ID: ${{ inputs.discussion_node_id }}
          TARGET_ID: ${{ inputs.target_id }}
        run: |
          set +e
          out=/tmp/post-out.txt
          : > "$out"
          echo "action=$ACTION body_file=$BODY_FILE discussion=$DISCUSSION_ID target=$TARGET_ID" >> "$out"
          echo "login=$(gh api user --jq .login 2>&1)" >> "$out"
          echo "token_type=$(gh auth status 2>&1 | grep -i 'token' | head -2 | tr '\n' ' ')" >> "$out"
          echo "body_bytes=$(wc -c < "$BODY_FILE" 2>&1)" >> "$out"
          rc=1
          case "$ACTION" in
            create)
              gh api graphql -f id="$DISCUSSION_ID" -F body=@"$BODY_FILE" -f query='
              mutation($id: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: $id, body: $body}) {
                  comment { id url author { login } }
                }
              }' >> "$out" 2>&1; rc=$? ;;
            reply)
              gh api graphql -f id="$DISCUSSION_ID" -f reply="$TARGET_ID" -F body=@"$BODY_FILE" -f query='
              mutation($id: ID!, $reply: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: $id, replyToId: $reply, body: $body}) {
                  comment { id url author { login } }
                }
              }' >> "$out" 2>&1; rc=$? ;;
            update)
              gh api graphql -f id="$TARGET_ID" -F body=@"$BODY_FILE" -f query='
              mutation($id: ID!, $body: String!) {
                updateDiscussionComment(input: {commentId: $id, body: $body}) {
                  comment { id url author { login } }
                }
              }' >> "$out" 2>&1; rc=$? ;;
            read)
              rc=0
              for cid in $TARGET_ID; do
                echo "=== $cid" >> "$out"
                gh api graphql -f id="$cid" -f query='
                query($id: ID!) { node(id: $id) { ... on DiscussionComment {
                  url updatedAt lastEditedAt editor { login } isMinimized minimizedReason body } } }' \
                  --jq '.data.node | "url=\(.url) updatedAt=\(.updatedAt) lastEditedAt=\(.lastEditedAt) editor=\(.editor.login // "-") minimized=\(.isMinimized) \(.minimizedReason // "")\n\(.body)"' >> "$out" 2>&1 || rc=1
              done ;;
            relink)
              # replace links to solution files in the main repository by the published instance pages,
              # keeping the rest of the live comment (which may carry maintainer edits) byte for byte
              rc=0
              for cid in $TARGET_ID; do
                gh api graphql -f id="$cid" -f query='
                query($id: ID!) { node(id: $id) { ... on DiscussionComment { body } } }' --jq '.data.node.body' > /tmp/live.md || rc=1
                sed -E 's#https://github\.com/hodge-computer/sextics/blob/main/data/([a-z0-9-]+)/solution\.md#https://hodge.computer/\#case/\1/solution#g' /tmp/live.md > /tmp/new.md
                echo "=== $cid: $(diff /tmp/live.md /tmp/new.md | grep -c '^>') line(s) changed, bytes $(wc -c < /tmp/live.md) -> $(wc -c < /tmp/new.md)" >> "$out"
                if ! cmp -s /tmp/live.md /tmp/new.md; then
                  gh api graphql -f id="$cid" -F body=@/tmp/new.md -f query='
                  mutation($id: ID!, $body: String!) {
                    updateDiscussionComment(input: {commentId: $id, body: $body}) { comment { url } } }' >> "$out" 2>&1 || rc=1
                fi
                grep -o 'https://[^) ]*' /tmp/new.md | sort -u >> "$out"
              done ;;
          esac
          echo "exit=$rc" >> "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Record outcome as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="post run ${GITHUB_RUN_ID}: exit ${{ steps.post.outputs.rc }}"
          { echo '```'; cat /tmp/post-out.txt; echo '```'; } > /tmp/issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/issue-body.md
      - name: Fail if the post failed
        if: steps.post.outputs.rc != '0'
        run: exit 1
